name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pin to a Playnite 10.x release - Toolbox.exe from 11 would produce
  # packages for the plugin model, not the PowerShell scripts these
  # extensions are written against (see README's Playnite 11 note).
  PLAYNITE_VERSION: "10.56"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Build extensions
        run: python tools/build-extension.py

      - name: Setup Playnite
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/JosefNemec/Playnite/releases/download/$env:PLAYNITE_VERSION/$env:PLAYNITE_VERSION.7z" -OutFile "Playnite.7z"
          7z x "Playnite.7z" -oPlaynite

      - name: Pack extensions with Toolbox
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path PackingOutput | Out-Null
          Get-ChildItem -Directory dist | ForEach-Object {
            & "Playnite\Toolbox.exe" pack $_.FullName "PackingOutput"
          }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: PackingOutput/*.pext
          generate_release_notes: true
